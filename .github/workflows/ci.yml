name: CI

# Two lanes. version-15 must pass. version-16 reports and gates nothing. See ADR-015.
#
# There is no develop lane any more: v17 is out of the plan (owner decision, 15 October 2026). A
# lane nobody is going to act on is not an early warning, it is a red cross people learn to skip
# past - and the habit of skipping past red crosses is what let this workflow sit broken from
# September without anyone noticing.
#
# version-16 reports rather than blocks. That is **ADR-015**, decided 21 September: "the
# version-16 and develop CI lanes stay in the workflow but gate nothing". This file said the
# opposite until now - the matrix marked v16 as required and the line above claimed it must pass -
# and nobody noticed, because the account's billing lock meant no job had started since before the
# ADR was written. Getting v16 green is its own work on its own branch; flip `experimental` back
# to false there.
on:
  # Only main on push. Every other branch is covered by `pull_request`, and listing branches here
  # as well meant a branch with a pull request open ran the whole matrix twice for one commit -
  # two identical runs, seconds apart.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.branch }}
    # ubuntu-22.04 was retired from GitHub-hosted runners; pinning it meant no runner was ever
    # assigned and every job died in 2s with zero steps. Track the current image instead.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        # Each lane gets the Python its Frappe asks for. This is not a detail: frappe
        # version-16 declares `requires-python = ">=3.14,<3.15"` and uses PEP 695 type aliases
        # (`type X = ...`), which are a syntax error before 3.12 - so pinning one Python for the
        # whole matrix meant the v16 lane could never get past `bench init`. Nobody knew,
        # because no run of this workflow had ever started a job.
        include:
          - branch: version-15
            python: "3.11"
            node: "20"
            experimental: false
          - branch: version-16
            python: "3.14"
            node: "24"
            # Reporting, not blocking - see the note at the top. Flip this back to false once
            # the v16 branch has it passing.
            experimental: true

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:alpine
        ports: ["6379:6379"]

    steps:
      - name: Check out fieldmate
        uses: actions/checkout@v4
        with:
          path: fieldmate

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install system packages
        # No wkhtmltopdf: it was dropped from the Ubuntu archives and nothing here renders PDFs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client libmariadb-dev
          npm install -g yarn

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent; then
              echo "mariadb up"; break
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install bench and initialise
        run: |
          pip install --upgrade pip
          pip install frappe-bench
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --frappe-branch ${{ matrix.branch }} \
            ci-bench

      - name: Get erpnext and hrms
        working-directory: ci-bench
        run: |
          bench get-app --branch ${{ matrix.branch }} --skip-assets erpnext \
            || bench get-app --branch develop --skip-assets erpnext
          bench get-app --branch ${{ matrix.branch }} --skip-assets hrms \
            || bench get-app --branch develop --skip-assets hrms

      - name: Link fieldmate into the bench
        working-directory: ci-bench
        run: |
          cp -r "$GITHUB_WORKSPACE/fieldmate" apps/fieldmate
          ./env/bin/pip install -e apps/fieldmate
          # apps.txt does not always end in a newline, and `echo fieldmate >>` then glues the
          # name onto the last one. That is how the site tried to import `erpnextfieldmate`
          # and the whole lane died on a ModuleNotFoundError nobody could place.
          if ! grep -qx fieldmate sites/apps.txt; then
            if [ -n "$(tail -c1 sites/apps.txt)" ]; then echo >> sites/apps.txt; fi
            echo fieldmate >> sites/apps.txt
          fi
          echo "apps.txt is now:"; cat sites/apps.txt

      - name: Create site and install apps
        working-directory: ci-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"
          bench new-site ci.localhost \
            --db-root-username root \
            --db-root-password root \
            --admin-password admin \
            --mariadb-user-host-login-scope='%'
          bench --site ci.localhost install-app erpnext
          bench --site ci.localhost install-app hrms
          bench --site ci.localhost install-app fieldmate
          bench --site ci.localhost set-config allow_tests true

      - name: Lint
        working-directory: ci-bench/apps/fieldmate
        run: |
          pip install ruff
          ruff check fieldmate

      - name: Run tests
        working-directory: ci-bench
        run: bench --site ci.localhost run-tests --app fieldmate

      - name: Frontend tests and build
        working-directory: ci-bench/apps/fieldmate/frontend
        # The PWA suite ran on developer machines and nowhere else. The cart's arithmetic, the
        # offline queue and the sync reconciliation all live here, and a build succeeding says
        # only that the files parse.
        run: |
          npm ci
          npm test
          npm run build

      - name: Scheme parity, all three pairings
        working-directory: ci-bench/apps/fieldmate
        # `npm test` now runs the corpus through the JavaScript engine and `run-tests` runs it
        # through the Python one, so the two halves are covered above. This step is the harness
        # itself: it diffs the two engines against each other as canonical bytes and would catch a
        # field the corpus happens not to pin, and it keeps `scripts/parity.sh` from rotting
        # unnoticed - a gate script nothing runs is a gate nobody has.
        run: bash scripts/parity.sh
