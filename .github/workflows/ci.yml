name: CI

# Three lanes, every push. version-15 and version-16 must pass. develop is allowed to fail,
# but its result is recorded and triaged — that is how we learn about a v17 break weeks before
# customers do. See docs/DECISIONS.md ADR-005.
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.branch }}
    # ubuntu-22.04 was retired from GitHub-hosted runners; pinning it meant no runner was ever
    # assigned and every job died in 2s with zero steps. Track the current image instead.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: version-15
            experimental: false
          - branch: version-16
            experimental: false
          - branch: develop
            experimental: true

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:alpine
        ports: ["6379:6379"]

    steps:
      - name: Check out fieldmate
        uses: actions/checkout@v4
        with:
          path: fieldmate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system packages
        # No wkhtmltopdf: it was dropped from the Ubuntu archives and nothing here renders PDFs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client libmariadb-dev
          npm install -g yarn

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent; then
              echo "mariadb up"; break
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install bench and initialise
        run: |
          pip install --upgrade pip
          pip install frappe-bench
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --frappe-branch ${{ matrix.branch }} \
            ci-bench

      - name: Get erpnext and hrms
        working-directory: ci-bench
        run: |
          bench get-app --branch ${{ matrix.branch }} --skip-assets erpnext \
            || bench get-app --branch develop --skip-assets erpnext
          bench get-app --branch ${{ matrix.branch }} --skip-assets hrms \
            || bench get-app --branch develop --skip-assets hrms

      - name: Link fieldmate into the bench
        working-directory: ci-bench
        run: |
          cp -r "$GITHUB_WORKSPACE/fieldmate" apps/fieldmate
          ./env/bin/pip install -e apps/fieldmate
          grep -qx fieldmate sites/apps.txt || echo fieldmate >> sites/apps.txt

      - name: Create site and install apps
        working-directory: ci-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"
          bench new-site ci.localhost \
            --db-root-username root \
            --db-root-password root \
            --admin-password admin \
            --mariadb-user-host-login-scope='%'
          bench --site ci.localhost install-app erpnext
          bench --site ci.localhost install-app hrms
          bench --site ci.localhost install-app fieldmate
          bench --site ci.localhost set-config allow_tests true

      - name: Lint
        working-directory: ci-bench/apps/fieldmate
        run: |
          pip install ruff
          ruff check fieldmate

      - name: Run tests
        working-directory: ci-bench
        run: bench --site ci.localhost run-tests --app fieldmate

      - name: Frontend build
        working-directory: ci-bench/apps/fieldmate/frontend
        run: |
          npm ci
          npm run build
