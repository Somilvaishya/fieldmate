[project]
name = "fieldmate"
authors = [
    { name = "somilvaishya", email = "nexaflowtech007@gmail.com"}
]
description = "Sales Force Automation for field sales teams - offline-first PWA on Frappe and ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Which host this app may be installed on. Frappe Cloud reads this to decide whether the app
# fits a bench, and refuses to add it without the section at all.
#
# **erpnext only**, because that is the one app FieldMate genuinely cannot run without - it is
# `required_apps` in hooks.py and `compat.REQUIRED_APPS` agrees. `hrms` and `india_compliance` are
# deliberately NOT here: both are probed at runtime and the app installs and works without them
# (`compat.OPTIONAL_APPS`, and `make_expense_claim` answers None where HRMS is absent). Listing
# them would make Frappe Cloud demand apps that are optional by design.
#
# Pinned **below 16** on purpose. The minimums in `compat.MIN_VERSIONS` are 15.0; v17 is out of
# the plan and v16 is deferred and unverified (ADR-034), so neither is claimed here. When somebody
# tests a v16 bench, this bound is the deliberate decision to revisit, rather than an app silently
# installing onto a host nobody has run it on.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
